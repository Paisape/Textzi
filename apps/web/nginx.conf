# nginx.conf

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 6;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Vite's build hashes every filename under /assets/ (e.g. index-DczZYSQV.js) so a new deploy
    # always ships new filenames -- these can be cached by the browser indefinitely, letting a
    # repeat visit skip re-downloading anything unchanged since their last visit.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file that must NEVER be cached -- it's what references the current
    # build's hashed asset filenames, so a stale cached copy would keep pointing at a deploy
    # that's been replaced.
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Additional configurations go here...
}
