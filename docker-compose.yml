services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-textzi}
      POSTGRES_USER: ${POSTGRES_USER:-textzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    # No host port published -- api reaches this over the internal Docker network via the
    # "postgres" hostname regardless. Uncomment to connect a local DB client for debugging.
    # ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    # ports: ["5672:5672", "15672:15672"]
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    ports: ["8000:8000"]
    volumes: [uploads_data:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      rabbitmq: { condition: service_started }
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
  uploads_data:
