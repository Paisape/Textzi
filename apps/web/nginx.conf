# nginx.conf

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 6;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # This is the one service in the stack that serves real HTML (login, 2FA step-up, wallet
    # top-up) -- the API is pure JSON, so these headers matter here, not there. X-Frame-Options
    # blocks the app being framed for a clickjacking attack against those flows; nosniff stops a
    # response being reinterpreted as a different content-type than what was actually served.
    # nginx does NOT inherit add_header from the server block into a location that defines its own
    # add_header (a well-known gotcha, not a merge) -- both location blocks below already set their
    # own Cache-Control, so these two are repeated explicitly in each rather than silently dropped.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html is the one file that must NEVER be cached -- it's what references the current
    # build's hashed asset filenames, so a stale cached copy would keep pointing at a deploy
    # that's been replaced.
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Additional configurations go here...
}
